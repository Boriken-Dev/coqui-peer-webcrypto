[package]
name = "coqui-peer-webcrypto"
version = "0.0.0-alpha.0"
description = "The WebCrypto method of coqui-peer: mutual P-256 key proof, in a browser or natively, ending in an encrypted session"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-peer-webcrypto"
homepage = "https://boriken-dev.github.io/coqui-peer-webcrypto/"
keywords = ["webcrypto", "peer", "p256", "handshake", "browser"]
categories = ["cryptography", "authentication", "network-programming"]
exclude = [".*", "*.local.*", "/bindings/", "/tools/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# PIN pairing over a session: coqui-peer's `pin` (SPAKE2, HKDF, HMAC).
pin = ["coqui-peer/pin"]

[dependencies]
# The peer id, trust store, pairing and handshake this crate is a method of. The family has no
# releases for now: its crates depend on each other by git revision.
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "e0f96b80a6ecf48fa520f41d61909454862e7e55" }
# The settings types' value form and schema; alpha, by revision, as the family pins it (the one coqui-peer builds on).
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "03e1cac8be06715a8037f45f1610c5894eea0b5b", default-features = false, features = ["derive"] }
# ECDSA and ECDH over P-256, which is what WebCrypto offers everywhere. Pre-1.0: the RustCrypto
# release line sharing sha2 and hkdf with coqui-peer.
p256 = { version = "0.14", default-features = false, features = ["alloc", "ecdsa", "ecdh", "pkcs8"] }
# The session's records. Pre-1.0: the same release line.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
# The session's keys. Pre-1.0: the same release line, already in coqui-peer's `pin` build.
hkdf = { version = "0.13", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
# Strict base64url; already a dependency of coqui-peer.
data-encoding = { version = "2", default-features = false, features = ["alloc"] }
# The handshake messages.
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# Nonces and keys.
getrandom = { version = "0.4", default-features = false }
# Zeroes key bytes when they are dropped.
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Temporary store directories.
tempfile = "3"
# The settings types' text forms in tests, through guatiao-serde.
guatiao-serde = { git = "https://github.com/Boriken-Dev/guatiao", rev = "03e1cac8be06715a8037f45f1610c5894eea0b5b", default-features = false, features = ["json", "toml"] }

[[test]]
name = "pair"
required-features = ["pin"]
